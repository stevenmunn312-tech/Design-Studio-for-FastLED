<!DOCTYPE html>
<html lang="en" data-resolution="landscape" data-composition-variables='[
    {"id":"name","type":"string","label":"Export name","default":"title-01"},
    {"id":"cardType","type":"enum","label":"Card type","default":"title","options":[{"value":"title","label":"Opening title"},{"value":"end","label":"Next tutorial"},{"value":"complete","label":"Series complete"}]},
    {"id":"tutorialNumber","type":"string","label":"Tutorial number","default":"01"},
    {"id":"eyebrow","type":"string","label":"Eyebrow","default":"BEGINNER SERIES / TUTORIAL 01"},
    {"id":"title","type":"string","label":"Title","default":"Build Your First Pattern with Juggle"},
    {"id":"supportingLine","type":"string","label":"Supporting line","default":"Make pixels, add effects, and watch the preview"},
    {"id":"progress","type":"number","label":"Progress","default":1,"min":1,"max":11,"step":1},
    {"id":"motif","type":"enum","label":"Motif","default":"juggle","options":[{"value":"juggle","label":"Juggle"},{"value":"interface","label":"Interface"},{"value":"audio","label":"Audio"},{"value":"group","label":"Group"},{"value":"percussion","label":"Percussion"},{"value":"generative","label":"Generative"},{"value":"music","label":"Music"},{"value":"sd","label":"SD card"},{"value":"compare","label":"Comparison"},{"value":"hardware","label":"Hardware"},{"value":"save","label":"Save"}]},
    {"id":"accent","type":"color","label":"Accent","default":"#33D6FF"}
  ]'>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Audiowide";
        src: url("./assets/Audiowide-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      :root {
        --bg: #0d0f12;
        --panel: #161a1f;
        --node: #1f242b;
        --text: #e0e0e0;
        --muted: #a0a0a0;
        --pattern: #33d6ff;
        --show: #8533ff;
        --output: #d633ff;
        --library: #ff3385;
        --audio: #85ff33;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
      }

      body {
        font-family: "Inter", sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        color: var(--text);
      }

      #card {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .scene-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 79% 44%, rgba(51, 214, 255, 0.105), transparent 28%),
          radial-gradient(circle at 91% 68%, rgba(214, 51, 255, 0.09), transparent 24%),
          var(--bg);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 2px, transparent 2px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 2px, transparent 2px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at 70% 48%, black 0%, transparent 72%);
        opacity: 0.72;
      }

      .top-rule,
      .bottom-rule {
        position: absolute;
        left: 150px;
        right: 150px;
        height: 2px;
        transform-origin: left center;
        background: rgba(255, 255, 255, 0.12);
      }

      .top-rule {
        top: 252px;
      }

      .bottom-rule {
        bottom: 108px;
      }

      .top-rule::after {
        content: "";
        display: block;
        width: 280px;
        height: 2px;
        background: linear-gradient(90deg, var(--pattern), var(--show), var(--output));
      }

      .brand {
        position: absolute;
        top: 72px;
        left: 150px;
        display: flex;
        align-items: center;
        gap: 28px;
        width: 650px;
        height: 132px;
      }

      .brand img {
        display: block;
        width: 550px;
        height: auto;
        max-height: 112px;
        object-fit: contain;
        object-position: left center;
      }

      .brand-meta {
        border-left: 2px solid rgba(255, 255, 255, 0.13);
        padding-left: 22px;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 19px;
        line-height: 1.45;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .brand-meta span {
        display: block;
      }

      #title-panel {
        position: absolute;
        left: 150px;
        top: 330px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 1040px;
        min-height: 450px;
        padding: 0 24px 0 0;
      }

      #eyebrow {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 30px;
        color: var(--accent);
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.14em;
        line-height: 1.2;
        text-transform: uppercase;
      }

      #eyebrow::before {
        content: "";
        flex: 0 0 62px;
        height: 5px;
        border-radius: 99px;
        background: var(--accent);
        box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 58%, transparent);
      }

      #hero-title {
        display: block;
        max-width: 1020px;
        margin: 0;
        color: var(--text);
        font-family: "Audiowide", "Inter", sans-serif;
        font-size: var(--title-size, 82px);
        font-weight: 400;
        letter-spacing: -0.025em;
        line-height: 1.08;
        text-wrap: balance;
      }

      #supporting-line {
        display: block;
        max-width: 940px;
        margin: 30px 0 0;
        color: var(--muted);
        font-size: 31px;
        font-weight: 400;
        letter-spacing: 0.01em;
        line-height: 1.35;
      }

      .graph-zone {
        position: absolute;
        top: 285px;
        right: 40px;
        width: 720px;
        height: 620px;
        overflow: visible;
      }

      .graph-frame {
        position: absolute;
        inset: 0;
        border: 2px solid rgba(255, 255, 255, 0.09);
        border-radius: 18px;
        background:
          radial-gradient(circle at 36% 45%, rgba(51, 214, 255, 0.09), transparent 35%),
          rgba(22, 26, 31, 0.52);
        box-shadow:
          inset 0 0 0 2px rgba(255, 255, 255, 0.015),
          0 24px 70px rgba(0, 0, 0, 0.32);
      }

      .graph-label {
        position: absolute;
        top: 26px;
        left: 34px;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .graph-status {
        position: absolute;
        top: 24px;
        right: 28px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--pattern);
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.08em;
      }

      .graph-status::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--pattern);
        box-shadow: 0 0 14px rgba(51, 214, 255, 0.8);
      }

      .signal-svg {
        position: absolute;
        inset: 0;
        width: 720px;
        height: 620px;
        overflow: visible;
      }

      .signal-base {
        fill: none;
        stroke: rgba(51, 214, 255, 0.28);
        stroke-width: 4;
        stroke-linecap: round;
        opacity: 0;
      }

      .signal-drawn {
        fill: none;
        stroke: url("#signal-gradient");
        stroke-width: 5;
        stroke-linecap: round;
        filter: drop-shadow(0 0 8px rgba(51, 214, 255, 0.45));
        opacity: 0;
      }

      .signal-pulse {
        fill: none;
        stroke: #effcff;
        stroke-width: 9;
        stroke-linecap: round;
        filter: drop-shadow(0 0 11px rgba(51, 214, 255, 0.95));
        opacity: 0;
      }

      .motif-compare .signal-svg,
      .motif-hardware .signal-svg,
      .motif-save .signal-svg {
        opacity: 0;
      }

      .node-panel {
        position: absolute;
        top: 114px;
        display: flex;
        width: 215px;
        height: 470px;
        align-items: center;
        justify-content: center;
        overflow: visible;
      }

      .node-panel::before {
        display: none;
      }

      .node-source {
        left: 0;
      }

      .node-process {
        left: 252px;
      }

      .node-output {
        left: 505px;
      }

      .node-card {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.42));
      }

      .matrix-shell {
        position: absolute;
        top: 88px;
        right: 42px;
        width: 210px;
        height: 118px;
        padding: 13px;
        border: 2px solid rgba(214, 51, 255, 0.28);
        border-radius: 12px;
        background: rgba(13, 15, 18, 0.92);
        box-shadow:
          inset 0 0 22px rgba(214, 51, 255, 0.08),
          0 0 30px rgba(214, 51, 255, 0.08);
      }

      .matrix-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 6px;
        width: 100%;
        height: 100%;
      }

      .matrix-cell {
        display: block;
        min-width: 0;
        min-height: 0;
        border-radius: 50%;
        background: color-mix(in srgb, var(--output) 84%, var(--pattern));
        box-shadow:
          0 0 7px color-mix(in srgb, var(--output) 70%, transparent),
          0 0 14px color-mix(in srgb, var(--pattern) 30%, transparent);
      }

      .progress-wrap {
        position: absolute;
        left: 150px;
        bottom: 58px;
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .progress-label {
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #progress-rail {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .progress-pixel {
        display: block;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-radius: 4px;
        background: rgba(224, 224, 224, 0.08);
      }

      .progress-pixel.done {
        border-color: var(--pattern);
        background: var(--pattern);
        box-shadow: 0 0 12px rgba(51, 214, 255, 0.54);
      }

      .progress-pixel.current {
        border-color: var(--output);
        background: var(--output);
        box-shadow: 0 0 15px rgba(214, 51, 255, 0.68);
      }

      .mode-complete #title-panel {
        width: 1120px;
      }

      .mode-complete #hero-title {
        color: var(--text);
      }

      .mode-complete #eyebrow {
        color: var(--output);
      }

      .mode-complete #eyebrow::before {
        background: var(--output);
      }

      .footer-meta {
        position: absolute;
        right: 150px;
        bottom: 62px;
        color: rgba(224, 224, 224, 0.52);
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-911h" id="stage" data-composition-id="tutorial-card" data-start="0" data-duration="7" data-fps="30" data-width="1920" data-height="1080">
      <section data-hf-id="hf-ttnh" id="card" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <div data-hf-id="hf-a01l" class="scene-bg" data-layout-ignore=""></div>
        <div data-hf-id="hf-80b5" class="grid" data-layout-ignore=""></div>
        <div data-hf-id="hf-dp2b" class="top-rule struct-line" data-layout-ignore=""></div>
        <div data-hf-id="hf-quob" class="bottom-rule struct-line" data-layout-ignore=""></div>

        <header data-hf-id="hf-in8v" class="brand">
          <img data-hf-id="hf-eooz" id="brand-lockup" src="./assets/design-studio-pixel-lockup.png" alt="Design Studio for FastLED">
          <div data-hf-id="hf-ej7r" class="brand-meta"><span data-hf-id="hf-d1yo">Tutorials</span><span data-hf-id="hf-652l">Signal live</span></div>
        </header>

        <main data-hf-id="hf-eg9o" id="title-panel">
          <div data-hf-id="hf-d0rn" id="eyebrow" data-var-text="eyebrow">BEGINNER SERIES / TUTORIAL 01</div>
          <h1 data-hf-id="hf-knq0" id="hero-title" data-var-text="title">Build Your First Pattern with Juggle</h1>
          <p data-hf-id="hf-4byb" id="supporting-line" data-var-text="supportingLine">
            Make pixels, add effects, and watch the preview
          </p>
        </main>

        <aside data-hf-id="hf-utzx" class="graph-zone" data-layout-allow-overflow="true">
          <div data-hf-id="hf-0ef4" class="graph-frame"></div>
          <div data-hf-id="hf-ddhk" class="graph-label">Signal overview</div>
          <div data-hf-id="hf-5i7h" class="graph-status">Live</div>

          <svg data-hf-id="hf-umsa" class="signal-svg" viewBox="0 0 720 620" aria-hidden="true">
            <defs data-hf-id="hf-mh0t">
              <lineargradient data-hf-id="hf-6v9t" id="signal-gradient" x1="0" y1="0" x2="1" y2="0">
                <stop data-hf-id="hf-25g3" offset="0%" stop-color="#33D6FF" />
                <stop data-hf-id="hf-cjvy" offset="55%" stop-color="#8533FF" />
                <stop data-hf-id="hf-4avu" offset="100%" stop-color="#D633FF" />
              </lineargradient>
            </defs>
            <path data-hf-id="hf-a4qd" id="signal-base-a" class="signal-base" d="M 214 355 C 232 355, 232 405, 252 405" pathLength="1000" />
            <path data-hf-id="hf-a4qe" id="signal-base-b" class="signal-base" d="M 467 405 C 485 405, 485 355, 505 355" pathLength="1000" />
            <path data-hf-id="hf-6qqt" id="signal-drawn-a" class="signal-drawn" d="M 214 355 C 232 355, 232 405, 252 405" pathLength="1000" />
            <path data-hf-id="hf-6qqu" id="signal-drawn-b" class="signal-drawn" d="M 467 405 C 485 405, 485 355, 505 355" pathLength="1000" />
            <path data-hf-id="hf-bwwd" id="signal-pulse-a" class="signal-pulse" d="M 214 355 C 232 355, 232 405, 252 405" pathLength="1000" />
            <path data-hf-id="hf-bwwe" id="signal-pulse-b" class="signal-pulse" d="M 467 405 C 485 405, 485 355, 505 355" pathLength="1000" />
          </svg>

          <div data-hf-id="hf-yto0" class="node-panel node-source graph-node">
            <img data-hf-id="hf-wo05" id="source-node-card" class="node-card" src="./assets/node-cards/juggle.svg" alt="Juggle node">
          </div>

          <div data-hf-id="hf-jnq0" class="node-panel node-process graph-node">
            <img data-hf-id="hf-jvn8" id="process-node-card" class="node-card" src="./assets/node-cards/trails.svg" alt="Trails node">
          </div>

          <div data-hf-id="hf-zryg" class="node-panel node-output graph-node">
            <img data-hf-id="hf-1dcl" id="output-node-card" class="node-card" src="./assets/node-cards/matrix-output.svg" alt="Matrix Output node">
          </div>

          <div data-hf-id="hf-3dci" class="matrix-shell">
            <div data-hf-id="hf-q2qe" id="matrix-grid" class="matrix-grid"></div>
          </div>
        </aside>

        <div data-hf-id="hf-ysia" class="progress-wrap">
          <span data-hf-id="hf-44pn" class="progress-label">Series progress</span>
          <div data-hf-id="hf-1cuc" id="progress-rail" aria-label="Tutorial series progress"></div>
        </div>

        <div data-hf-id="hf-avrk" class="footer-meta">1920 × 1080 / 30 FPS</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const variables = window.__hyperframes?.getVariables?.() || {
        name: "title-01",
        cardType: "title",
        tutorialNumber: "01",
        eyebrow: "BEGINNER SERIES / TUTORIAL 01",
        title: "Build Your First Pattern with Juggle",
        supportingLine: "Make pixels, add effects, and watch the preview",
        progress: 1,
        motif: "juggle",
        accent: "#33D6FF"
      };

      const {
        cardType,
        tutorialNumber,
        title,
        progress,
        motif,
        accent
      } = variables;

      const stage = document.getElementById("stage");
      stage.classList.add(`mode-${cardType}`, `motif-${motif}`);
      stage.style.setProperty("--accent", accent);

      const titleSize = title.length > 46 ? 66 : title.length > 38 ? 73 : title.length > 30 ? 80 : 88;
      stage.style.setProperty("--title-size", `${titleSize}px`);

      const motifCards = {
        juggle: [
          ["juggle", "Juggle"],
          ["trails", "Trails"],
          ["matrix-output", "Matrix Output"]
        ],
        interface: [
          ["juggle", "Juggle"],
          ["trails", "Trails"],
          ["matrix-output", "Matrix Output"]
        ],
        audio: [
          ["mic-input", "Microphone"],
          ["spectrum-visualizer", "Spectrum Visualizer"],
          ["matrix-output", "Matrix Output"]
        ],
        group: [
          ["spectrum-visualizer", "Spectrum Visualizer"],
          ["trails", "Trails"],
          ["matrix-output", "Matrix Output"]
        ],
        percussion: [
          ["percussion-detect", "Percussion Detect"],
          ["kick-shock", "Kick Shock"],
          ["matrix-output", "Matrix Output"]
        ],
        generative: [
          ["pattern-collection", "Pattern Collection"],
          ["pattern-master", "Show Engine"],
          ["matrix-output", "Matrix Output"]
        ],
        music: [
          ["music-library", "Music Library"],
          ["performance-generator", "Performance Generator"],
          ["sd-card", "SD Card"]
        ],
        sd: [
          ["performance-generator", "Performance Generator"],
          ["sd-card", "SD Card"],
          ["matrix-output", "Matrix Output"]
        ],
        compare: [
          ["pattern-collection", "Pattern Collection"],
          ["pattern-master", "Show Engine"],
          ["performance-generator", "Performance Generator"]
        ],
        hardware: [
          ["mic-input", "Microphone"],
          ["sd-card", "SD Card"],
          ["matrix-output", "Matrix Output"]
        ],
        save: [
          ["comment", "Comment"],
          ["pattern-collection", "Pattern Collection"],
          ["matrix-output", "Matrix Output"]
        ]
      };

      const cards = motifCards[motif] || motifCards.juggle;
      ["source", "process", "output"].forEach((slot, index) => {
        const [fileName, label] = cards[index];
        const image = document.getElementById(`${slot}-node-card`);
        image.src = `./assets/node-cards/${fileName}.svg`;
        image.alt = `${label} node`;
      });

      const nodeHeights = {
        juggle: 524,
        comment: 178,
        "mic-input": 226,
        "spectrum-visualizer": 482,
        trails: 461,
        "percussion-detect": 261,
        "kick-shock": 748,
        "pattern-collection": 158,
        "pattern-master": 762,
        "music-library": 158,
        "performance-generator": 310,
        "sd-card": 268,
        "matrix-output": 324
      };

      const motifPorts = {
        juggle: [[280, 280], [280, 52]],
        interface: [[280, 280], [280, 52]],
        audio: [[52, 280], [280, 52]],
        group: [[280, 280], [280, 52]],
        percussion: [[52, 280], [280, 52]],
        generative: [[52, 280], [280, 52]],
        music: [[52, 52], [52, 52]],
        sd: [[52, 52], [52, 80]]
      };

      const slotLeft = [0, 252, 505];
      const slotTop = 114;
      const slotWidth = 215;
      const slotHeight = 470;
      const sourceWidth = 296;

      const nodePortPoint = (slotIndex, fileName, side, portY) => {
        const sourceHeight = nodeHeights[fileName];
        const scale = Math.min(slotWidth / sourceWidth, slotHeight / sourceHeight);
        const renderedWidth = sourceWidth * scale;
        const renderedHeight = sourceHeight * scale;
        const offsetX = (slotWidth - renderedWidth) / 2;
        const offsetY = (slotHeight - renderedHeight) / 2;
        const sourceX = side === "right" ? 270 : 26;
        return {
          x: slotLeft[slotIndex] + offsetX + sourceX * scale,
          y: slotTop + offsetY + (24 + portY) * scale
        };
      };

      const wirePath = (from, to) => {
        const control = Math.max(12, Math.min(28, (to.x - from.x) * 0.46));
        return `M ${from.x.toFixed(1)} ${from.y.toFixed(1)} C ${(from.x + control).toFixed(1)} ${from.y.toFixed(1)}, ${(to.x - control).toFixed(1)} ${to.y.toFixed(1)}, ${to.x.toFixed(1)} ${to.y.toFixed(1)}`;
      };

      const topology = motifPorts[motif];
      if (topology) {
        topology.forEach(([fromPortY, toPortY], index) => {
          const from = nodePortPoint(index, cards[index][0], "right", fromPortY);
          const to = nodePortPoint(index + 1, cards[index + 1][0], "left", toPortY);
          const path = wirePath(from, to);
          const suffix = index === 0 ? "a" : "b";
          document.getElementById(`signal-base-${suffix}`).setAttribute("d", path);
          document.getElementById(`signal-drawn-${suffix}`).setAttribute("d", path);
          document.getElementById(`signal-pulse-${suffix}`).setAttribute("d", path);
        });
      }

      const matrix = document.getElementById("matrix-grid");
      for (let i = 0; i < 32; i += 1) {
        const cell = document.createElement("span");
        cell.className = "matrix-cell";
        matrix.appendChild(cell);
      }

      const rail = document.getElementById("progress-rail");
      const currentStep = Math.max(1, Math.min(11, Number(progress) || 1));
      for (let i = 1; i <= 11; i += 1) {
        const pixel = document.createElement("span");
        pixel.className = "progress-pixel";
        if (cardType === "complete" || i < currentStep) pixel.classList.add("done");
        else if (i === currentStep) pixel.classList.add("current");
        rail.appendChild(pixel);
      }

      document.querySelector(".footer-meta").textContent =
        cardType === "complete"
          ? "Series complete / 11 of 11"
          : `Tutorial ${tutorialNumber} / 11`;

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(".grid", { opacity: 0 }, { opacity: 0.72, duration: 0.75, ease: "sine.out" }, 0.18);
      tl.fromTo(".struct-line", { scaleX: 0 }, { scaleX: 1, duration: 0.82, stagger: 0.12, ease: "expo.out" }, 0.22);
      tl.fromTo(".brand", { autoAlpha: 0, x: -28 }, { autoAlpha: 1, x: 0, duration: 0.58, ease: "power3.out" }, 0.2);
      tl.fromTo(".graph-frame", { autoAlpha: 0, scale: 0.985 }, { autoAlpha: 1, scale: 1, duration: 0.72, ease: "circ.out" }, 0.24);
