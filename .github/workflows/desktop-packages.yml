name: Desktop Packages

on:
  workflow_dispatch:
    inputs:
      package_scope:
        description: Platforms to package
        required: true
        default: windows-only
        type: choice
        options:
          - all
          - windows-only
          - macos-arm64-only
          - macos-intel-only
          - macos-only
          - linux-only
  # No tag trigger: pushing a release tag must not start paid Windows and
  # macOS runners. Steve starts this workflow by hand when he chooses; the
  # release is built locally (docs/release/desktop-distribution.md).

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.target == 'windows-x86_64' && 'windows-latest' || matrix.target == 'macos-arm64' && 'macos-15' || matrix.target == 'macos-x86_64' && 'macos-15-intel' || 'ubuntu-22.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.package_scope == 'windows-only' && '["windows-x86_64"]' || inputs.package_scope == 'macos-arm64-only' && '["macos-arm64"]' || inputs.package_scope == 'macos-intel-only' && '["macos-x86_64"]' || inputs.package_scope == 'macos-only' && '["macos-arm64","macos-x86_64"]' || inputs.package_scope == 'linux-only' && '["linux-x86_64"]' || '["windows-x86_64","macos-arm64","macos-x86_64","linux-x86_64"]') }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-packaging.txt
            backend/constraints.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install desktop packaging dependencies
        run: python -m pip install -r backend/requirements-packaging.txt -c backend/constraints.txt

      # The fbuild wheel once carried macOS executables that did not run
      # (2.5.4: dyld rejected the ARM binary, the Intel host got the wrong CPU
      # slice), so this job built both tools from source. The pinned wheel's
      # own tools are checked here instead, before anything is packaged.
      - name: Check the wheel's macOS fbuild tools
        if: ${{ startsWith(matrix.target, 'macos-') }}
        shell: bash
        run: |
          for tool in fbuild fbuild-daemon; do
            file "$(command -v "$tool")"
          done
          fbuild --version

      - name: Build and launch-smoke desktop package
        if: ${{ matrix.target != 'windows-x86_64' }}
        run: npm run package:desktop

      # Windows also packs the MSIX for the Microsoft Store. The identity comes
      # from Partner Center through repository variables (public values, shown
      # in the Store listing); unset, the build uses local test values, which a
      # Store upload rejects. See docs/release/microsoft-store.md.
      - name: Build, launch-smoke and MSIX-pack Windows package
        if: ${{ matrix.target == 'windows-x86_64' }}
        shell: bash
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          args=(--msix)
          if [ -n "$MSIX_IDENTITY_NAME" ]; then args+=(--msix-identity-name "$MSIX_IDENTITY_NAME"); fi
          if [ -n "$MSIX_PUBLISHER" ]; then args+=(--msix-publisher "$MSIX_PUBLISHER"); fi
          if [ -n "$MSIX_PUBLISHER_DISPLAY_NAME" ]; then args+=(--msix-publisher-display-name "$MSIX_PUBLISHER_DISPLAY_NAME"); fi
          npm run package:desktop -- "${args[@]}"

      - name: Write package checksums
        run: >-
          python -c "from pathlib import Path; import hashlib;
          files = sorted(p for p in Path('release/desktop').glob('DesignStudioForFastLED-*') if p.is_file() and not p.name.endswith('.sha256'));
          archives = [p for p in files if p.suffix != '.msix'];
          assert len(archives) == 1, f'expected one archive, found: {archives}';
          [p.with_name(p.name + '.sha256').write_text(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n', encoding='utf-8') for p in files]"

      # The provenance record: GitHub signs which workflow run, commit and
      # runner produced each file. Check one with
      #   gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/desktop/DesignStudioForFastLED-*.zip
            release/desktop/DesignStudioForFastLED-*.tar.gz
            release/desktop/DesignStudioForFastLED-*.msix

      - name: Upload desktop archive
        uses: actions/upload-artifact@v6
        with:
          name: design-studio-for-fastled-${{ matrix.target }}
          path: |
            release/desktop/DesignStudioForFastLED-*
            !release/desktop/*.msix
            !release/desktop/*.msix.sha256
          if-no-files-found: error
          retention-days: 7

      # Its own artifact, for Partner Center: an unsigned MSIX does not
      # install, and the Store signs the one it accepts.
      - name: Upload MSIX for Partner Center
        if: ${{ matrix.target == 'windows-x86_64' }}
        uses: actions/upload-artifact@v6
        with:
          name: msix-store-upload-${{ matrix.target }}
          path: |
            release/desktop/*.msix
            release/desktop/*.msix.sha256
          if-no-files-found: error
          retention-days: 30
