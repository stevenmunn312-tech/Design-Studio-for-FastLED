name: Compile matrix

# The compile fixtures (scripts/compile-fixtures/compile-matrix.py) on fbuild,
# Arduino CLI or both, split across parallel Windows runners and merged into
# one record. Started
# by hand: Actions > Compile matrix > Run workflow, or
#   gh workflow run compile-matrix.yml -f only="ir/normal@stm32 display/player"
# GitHub lists the workflow from the default branch, main; it builds `ref`
# (main unless told otherwise).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main
      engine:
        description: fbuild, arduino-cli or all
        default: all
      shards:
        description: Parallel runners (1-20)
        default: "20"
      only:
        description: Build only legs whose name contains one of these space-separated texts (blank for all)
        default: ""
      every:
        description: Build every chosen leg, not only those that prove something no other leg does
        type: boolean
        default: false
      save_cache:
        description: Save the build cache from the first shard of this run, when none exists for its key
        type: boolean
        default: false

concurrency:
  group: compile-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - id: shards
        shell: python
        run: |
          import json, os
          count = max(1, min(20, int("${{ inputs.shards }}" or "20")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"list={json.dumps([f'{i}/{count}' for i in range(1, count + 1)])}\n")

  build:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - run: git config --global core.longpaths true

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 3.11 runs the scripts. fbuild installs its pinned esptool for ESP32
      # builds with `uv tool install --python 3.10`; with 3.10 already here and
      # uv's cache restored, that step stops downloading an interpreter each
      # time, which ran past fbuild's 300 s limit on a C3 shard.
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11

      - run: pip install -r backend/requirements.txt -c backend/constraints.txt

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      # Arduino CLI 1.5.1, the release the laptop builds with; the cores the
      # shard needs are installed by --install-cores at their pinned releases.
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - id: name
        shell: bash
        run: echo "slug=$(echo '${{ matrix.shard }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # fbuild's toolchains and compiler cache and the Arduino cores. Not its
      # esptool installs: those are uv environments tied to an interpreter path on
      # the runner that made them, and restored onto another runner they fail
      # with "No Python at".
      #
      # One cache, restored by every shard and saved by one. A shard's cache is
      # about 7.8 GB and the repository keeps 10 GB, so a cache for each shard of
      # each commit took over a quarter of an hour to save after every job and
      # was evicted by the next. Bump `builds-v4` to refresh it.
      - id: builds
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.fbuild/prod/cache
            ~/.fbuild/prod/zccache
            !~/.fbuild/prod/cache/toolchains/pioarduino-esptool
            !~/.fbuild/prod/cache/toolchains/tasmota-esptool
            ~/AppData/Local/Arduino15/packages
          key: builds-v4-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            builds-v4-

      - name: Build shard ${{ matrix.shard }}
        shell: bash
        env:
          UV_PYTHON_PREFERENCE: only-system  # the 3.10 set up above, never a download
          # fbuild refuses to start with under 5 GB free beside its cache. A
          # shard holding the ESP32 toolchains restored from cache had 4.98 GB
          # and built nothing; 2 GB still stops a runner that is really full.
          FBUILD_MIN_DISK_BYTES: "2147483648"
        run: |
          only=()
          for text in ${{ inputs.only }}; do only+=(--only "$text"); done
          if [ "${{ inputs.every }}" = "true" ]; then only+=(--every); fi
          python scripts/compile-fixtures/compile-matrix.py --engine "${{ inputs.engine || 'all' }}" --install-cores             --shard "${{ matrix.shard }}" "${only[@]}"

      # Saved by the first shard of a whole-matrix run, and only when no cache
      # of this key exists: a run of a few named legs saves only when asked to
      # with `save_cache`.
      - if: ${{ always() && (inputs.only == '' || inputs.save_cache) && startsWith(matrix.shard, '1/') && steps.builds.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.fbuild/prod/cache
            ~/.fbuild/prod/zccache
            !~/.fbuild/prod/cache/toolchains/pioarduino-esptool
            !~/.fbuild/prod/cache/toolchains/tasmota-esptool
            ~/AppData/Local/Arduino15/packages
          key: builds-v4-${{ hashFiles('backend/requirements.txt') }}

      # The run folder plus every fbuild log and report beside the sketches,
      # at the paths summary.json names.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ steps.name.outputs.slug }}
          path: |
            artifacts/compile-matrix/
            artifacts/*-compile/*.fbuild*.log
            artifacts/*-compile/*.fbuild*.json
            artifacts/*-compile/*.arduino-cli*.log
            artifacts/*-compile/*.arduino-cli*.json
            backend/sketches/*/*.fbuild*.log
            backend/sketches/*/*.fbuild*.json
            backend/sketches/*/*.arduino-cli*.log
            backend/sketches/*/*.arduino-cli*.json
          if-no-files-found: warn

  merge:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r backend/requirements.txt -c backend/constraints.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      # Each shard artifact holds one artifacts/compile-matrix/<stamp>/ beside its logs.
      - name: Merge
        shell: bash
        run: |
          runs=()
          for run in shards/shard-*/artifacts/compile-matrix/*/; do
            [ -f "$run/summary.json" ] && runs+=("${run%/}")
          done
          python scripts/compile-fixtures/compile-matrix.py --merge "${runs[@]}" --merge-out merged || status=$?
          cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-matrix-record
          path: |
            merged/
            shards/
