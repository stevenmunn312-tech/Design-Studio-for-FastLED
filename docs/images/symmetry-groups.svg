<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">Wallpaper symmetry fundamental domains</title>
  <desc id="desc">Nine cards show the square or hexagonal lattice cell and the highlighted fundamental domain for p1, p2, pm, pmm, p4, p4m, p3, p6, and p6m.</desc>
  <rect width="1080" height="600" rx="28" fill="#0f1424"/>
  <defs>
    <style>.card{fill:#171e33;stroke:#334160;stroke-width:2}.cell{fill:none;stroke:#8694b5;stroke-width:3}.axis{stroke:#52617e;stroke-width:1.5;stroke-dasharray:5 5}.domain{fill:#48d7c8;fill-opacity:.72;stroke:#8ff5e9;stroke-width:2}.label{font:700 24px system-ui,sans-serif;fill:#f3f6ff}.kind{font:15px system-ui,sans-serif;fill:#9daccc}</style>
    <path id="hex" d="M0,-62 L54,-31 L54,31 L0,62 L-54,31 L-54,-31 Z"/>
  </defs>
  <g transform="translate(30 30)">
    <g><rect class="card" width="320" height="160" rx="18"/><text class="label" x="20" y="34">p1</text><text class="kind" x="20" y="57">translations</text><g transform="translate(230 80)"><rect class="domain" x="-58" y="-58" width="116" height="116"/><rect class="cell" x="-58" y="-58" width="116" height="116"/></g></g>
    <g transform="translate(350)"><rect class="card" width="320" height="160" rx="18"/><text class="label" x="20" y="34">p2</text><text class="kind" x="20" y="57">half-turn</text><g transform="translate(230 80)"><path class="domain" d="M0,-58 H58 V58 H0 Z"/><rect class="cell" x="-58" y="-58" width="116" height="116"/><line class="axis" y1="-58" y2="58"/></g></g>
    <g transform="translate(700)"><rect class="card" width="320" height="160" rx="18"/><text class="label" x="20" y="34">pm</text><text class="kind" x="20" y="57">one mirror</text><g transform="translate(230 80)"><path class="domain" d="M0,-58 H58 V58 H0 Z"/><rect class="cell" x="-58" y="-58" width="116" height="116"/><line class="axis" y1="-58" y2="58"/></g></g>
    <g transform="translate(0 190)"><rect class="card" width="320" height="160" rx="18"/><text class="label" x="20" y="34">pmm</text><text class="kind" x="20" y="57">two mirrors</text><g transform="translate(230 80)"><path class="domain" d="M0,0 H58 V58 H0 Z"/><rect class="cell" x="-58" y="-58" width="116" height="116"/><line class="axis" y1="-58" y2="58"/><line class="axis" x1="-58" x2="58"/></g></g>
    <g transform="translate(350 190)"><rect class="card" width="320" height="160" rx="18"/><text class="label" x="20" y="34">p4</text><text class="kind" x="20" y="57">quarter-turn</text><g transform="translate(230 80)"><path class="domain" d="M0,0 L58,-58 L58,58 Z"/><rect class="cell" x="-58" y="-58" width="116" height="116"/><line class="axis" x1="-58" x2="58"/><line class="axis" y1="-58" y2="58"/></g></g>
    <g transform="translate(700 190)"><rect class="card" width="320" height="160" rx="18"/><text class="label" x="20" y="34">p4m</text><text class="kind" x="20" y="57">quarter-turn + mirrors</text><g transform="translate(230 80)"><path class="domain" d="M0,0 L58,0 L58,58 Z"/><rect class="cell" x="-58" y="-58" width="116" height="116"/><line class="axis" x1="-58" x2="58"/><line class="axis" y1="-58" y2="58"/><line class="axis" x1="-58" y1="-58" x2="58" y2="58"/></g></g>
    <g transform="translate(0 380)"><rect class="card" width="320" height="160" rx="18"/><text class="label" x="20" y="34">p3</text><text class="kind" x="20" y="57">three-fold</text><g transform="translate(230 80)"><path class="domain" d="M0,0 L54,-31 L0,-62 Z"/><use href="#hex" class="cell"/><line class="axis" x1="-54" y1="31" x2="54" y2="-31"/></g></g>
    <g transform="translate(350 380)"><rect class="card" width="320" height="160" rx="18"/><text class="label" x="20" y="34">p6</text><text class="kind" x="20" y="57">six-fold</text><g transform="translate(230 80)"><path class="domain" d="M0,0 L54,-31 L54,31 Z"/><use href="#hex" class="cell"/><line class="axis" x1="-54" y1="31" x2="54" y2="-31"/><line class="axis" x1="-54" y1="-31" x2="54" y2="31"/></g></g>
    <g transform="translate(700 380)"><rect class="card" width="320" height="160" rx="18"/><text class="label" x="20" y="34">p6m</text><text class="kind" x="20" y="57">six-fold + mirrors</text><g transform="translate(230 80)"><path class="domain" d="M0,0 L54,0 L54,31 Z"/><use href="#hex" class="cell"/><line class="axis" x1="-54" x2="54"/><line class="axis" x1="-54" y1="31" x2="54" y2="-31"/><line class="axis" x1="-54" y1="-31" x2="54" y2="31"/></g></g>
  </g>
</svg>
